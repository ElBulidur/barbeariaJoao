<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/bb81d82619.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style-bs.css">
    <title>Barbearia Bootstrap</title>
</head>

<body>
    <main class="cont">
        <nav class="navbar header">
            <div class="container container-custom">
                <a class="navbar-brand" href="#">
                    <img src="../img/logo.png" class="logo-header" alt="Logo">
                </a>
                <a class="menu" href="#">
                    <i class="fa-solid fa-bars"></i>
                </a>
            </div>
        </nav>
        <form class="bg-black text-white box" style="--bs-bg-opacity: .8;">
            <img src="../img/logo.png" class="img-fluid logo-form" alt="Logo">
            <div class="col-sm-10 input">
                <input class="form-control" type="email" placeholder="E-mail" aria-label=".form-control-sm example">
            </div>
            <div class="col-sm-10 input">
                <input class="form-control" type="password" placeholder="Senha" aria-label=".form-control-sm example">
            </div>
            <button type="submit" class="btn btn-custom">Entrar</button>
            <a class="forgot" href="#">Redefinir senha</a>
            <p class="text-start register">Não tem login? <a class="link" href="#">Entre
                    aqui</a></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
